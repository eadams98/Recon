#Eureka Server Info
eureka.client.service-url.defaultZone=http://${EUREKA_SERVICE_NAME}:8761/eureka 

# Error Mapping
Report.NOT_FOUND = The Report was not found.
Report.Contractor.DUPLICATE_REPORT = A Report for this week already Exists. If you would like to modify this report, please follow the proper channels.
Report.NOT_FINALIZED = The report must be finalized before a junior contractor can add a retort.
Report.RETORT_EXISTS = A retort already exists for this report.
Report.RETORT_CONTENT_REQUIRED = Retort content is required.

#Clint info
server.port=${APP_PORT}
#spring.config.import=optional:configserver:http://localhost:8761
spring.application.name=report-service

spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# AWS SQL
#spring.datasource.url=jdbc:mysql://database-1.chwwf3hktlmf.us-east-2.rds.amazonaws.com:3306/recon
#spring.datasource.username=admin
#spring.datasource.password=password
# LOCAL SQL
spring.datasource.url=jdbc:mysql://${MYSQL_SERVICE_NAME}:3306/recon
spring.datasource.username=root
spring.datasource.password=root

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Inter-service HTTP (report-service -> user-service, email-service)
recon.inter-service.http.connect-timeout-ms=2000
recon.inter-service.http.read-timeout-ms=5000
recon.inter-service.http.retry.max-attempts=3
recon.inter-service.http.retry.backoff-ms=300